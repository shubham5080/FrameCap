[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
# hegota-support lives in the Next.js node_modules at repo root
allow_paths = ["../node_modules"]
remappings = [
  "@forshtat/hegota-support/=../node_modules/@forshtat/hegota-support/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
alt = "https://altmempoolgateway.forshtat.com/rpc"
